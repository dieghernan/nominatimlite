url: https://dieghernan.github.io/nominatimlite

template:
  bootstrap: 5
  package: gitdevr
  params:
    ganalytics: G-5SLV8G8QD4
  opengraph:
    twitter:
      creator: '@dhernangomez'
      card: summary_large_image

development:
  mode: auto

repo:
  branch: main

home:
  title: nominatimlite | Interface to the Nominatim API
  description: |
    Provides a lightweight interface to the Nominatim API for free-form and
    structured address searches, reverse geocoding, amenity lookup and address
    lookup by OpenStreetMap (OSM) object identifier. Results are returned as
    tibbles or `sf` objects.

authors:
  Diego Hernangómez:
    href: https://dieghernan.github.io/
  Jindra Lacko:
    href: https://www.jla-data.net/
  OpenStreetMap:
    href: https://www.openstreetmap.org/copyright/
    html: >
      <img src='https://wiki.openstreetmap.org/w/images/6/6f/Made_with.svg'
      width='150' alt='OpenStreetMap' style='margin-bottom: 3px;'>

reference:
- title: Address search
  desc: >
    Search for addresses with free-form and structured queries.
- contents:
  - has_concept("geocoding")

- title: Reverse geocoding
  desc: >
    Reverse geocode latitude and longitude coordinates.
- contents:
  - has_concept("reverse")

- title: Amenity lookup
  desc: >
    Look up OpenStreetMap amenities within a bounding box.
- contents:
  - has_concept("amenity")
  - -has_keyword("datasets")

- title: Address lookup
  desc: >
    Look up OpenStreetMap nodes, ways and relations by identifier.
- contents:
  - has_concept("lookup")

- title: Spatial output
  desc: >
    Convert bounding boxes to `sfc` polygon objects.
- contents:
  - bbox_to_poly

- title: Datasets
  desc: >
    Data shipped with the package.
- contents:
  - has_keyword("datasets")

- title: Package documentation
  desc: >
    Package overview and metadata.
- contents:
  - nominatimlite-package

articles:
- title: Get started
  desc: >
    Learn how to search for addresses, reverse geocode coordinates and work
    with Nominatim API results.
  contents:
  - nominatimlite

- title: Interactive maps
  navbar: Maps
  desc: >
    Display Nominatim API results with **leaflet** and use them in interactive
    spatial workflows.
  contents:
  - articles/leaflet
