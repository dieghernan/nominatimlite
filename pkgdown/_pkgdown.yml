url: https://dieghernan.github.io/nominatimlite

template:
  bootstrap: 5
  package: gitdevr
  params:
    ganalytics: G-5SLV8G8QD4
  opengraph:
    twitter:
      creator: '@dhernangomez'
      card: summary_large_image

development:
  mode: auto

repo:
  branch: main

home:
  title: nominatimlite | Interface to the Nominatim API
  description: |
    Provides a lightweight interface to the Nominatim API for free-form and
    structured address searches, reverse geocoding, amenity lookup and address
    lookup by OpenStreetMap (OSM) object identifier. Results are returned as
    tibbles or `sf` objects.

authors:
  Diego Hernangómez:
    href: https://dieghernan.github.io/
  Jindra Lacko:
    href: https://www.jla-data.net/
  OpenStreetMap contributors:
    href: https://www.openstreetmap.org/copyright/
    html: >
      <img src='https://wiki.openstreetmap.org/w/images/6/6f/Made_with.svg'
      width='150' alt='OpenStreetMap' style='margin-bottom: 3px;'>

reference:
- title: Geocoding
  desc: >
    Search OpenStreetMap using free-form text, structured queries or
    geographic coordinates.

- subtitle: Address search
  desc: >
    Search for places and addresses using free-form text or structured
    address components.
  contents:
  - has_concept("geocoding")

- subtitle: Reverse geocoding
  desc: >
    Convert latitude and longitude coordinates into human-readable
    addresses.
  contents:
  - has_concept("reverse")

- title: OpenStreetMap lookups
  desc: >
    Retrieve OpenStreetMap features directly from existing OSM
    identifiers or search for amenities within a geographic area.

- subtitle: Address lookup
  desc: >
    Retrieve OpenStreetMap nodes, ways and relations from their
    OSM identifiers.
  contents:
  - has_concept("lookup")
 
- subtitle: Amenity lookup
  desc: >
    Find OpenStreetMap amenities and points of interest inside a
    bounding box.
  contents:
  - has_concept("amenity")
  - -has_keyword("datasets")

- title: Utilities
  desc: >
    Helper functions and bundled datasets.

- subtitle: Spatial output
  desc: >
    Convert returned bounding boxes into `sf` polygon geometries.
  contents:
  - bbox_to_poly

- subtitle: Datasets
  desc: >
    Sample data included with the package.
  contents:
  - has_keyword("datasets")

- title: Package documentation
  desc: >
    Package overview and metadata.
- contents:
  - nominatimlite-package

articles:
- title: Get started
  desc: >
    Learn how to search for addresses, reverse geocode coordinates and work
    with Nominatim API results.
  contents:
  - nominatimlite

- title: Interactive maps
  navbar: Maps
  desc: >
    Display Nominatim API results with **leaflet** and use them in interactive
    spatial workflows.
  contents:
  - articles/leaflet
